# Mosquitto 2.x broker for the hub. Every client must authenticate.
# See protocol/mqtt-topics.md and docs/adr/0004-hub-and-spoke-transports.md.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Hardening step (recommended once devices support it): TLS on 8883.
# listener 8883
# cafile   /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile  /mosquitto/config/certs/server.key
