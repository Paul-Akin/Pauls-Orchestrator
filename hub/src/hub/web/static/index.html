<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hub</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="bar">
    <div class="brand">hub</div>
    <div class="providers" id="providers" aria-label="Provider status"></div>
  </header>

  <main id="log" class="log" aria-live="polite">
    <div class="empty" id="empty">
      <p>Ask anything. Pick a route, or leave it on <b>auto</b>.</p>
      <p class="muted">Every answer shows which model replied, its tokens and cost.
        The <b>private</b> route never leaves this machine.</p>
    </div>
  </main>

  <form id="composer" class="composer" autocomplete="off">
    <div class="attachments" id="attachments"></div>
    <textarea id="input" rows="2" placeholder="Message… (Enter to send, Shift+Enter for newline, paste images)" required></textarea>
    <div class="controls">
      <label class="route">
        <span>Route</span>
        <select id="route"><option value="auto">auto</option></select>
      </label>
      <label class="attach" title="Attach image">
        <input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
        <span aria-hidden="true">＋ image</span>
      </label>
      <label class="toggle" title="Look up relevant notes in ~/hub-memory before answering">
        <input type="checkbox" id="useMemory" checked>
        <span>memory</span>
      </label>
      <button type="button" id="rememberBtn" class="ghost" title="Save a note to memory">Remember</button>
      <button type="button" id="clear" class="ghost">New chat</button>
      <button type="submit" id="send">Send</button>
    </div>
  </form>

  <dialog id="rememberDialog">
    <form method="dialog" class="remember">
      <h3>Remember</h3>
      <input id="rememberTitle" placeholder="Title (optional: defaults to the first line)" maxlength="200">
      <textarea id="rememberText" rows="6" placeholder="What should the hub remember?" maxlength="100000"></textarea>
      <label class="route">
        <span>Sensitivity</span>
        <select id="rememberSensitivity">
          <option value="public">public: fine to send anywhere</option>
          <option value="personal" selected>personal: cloud models you chose may see it</option>
          <option value="private">private: only ever shown to local models</option>
        </select>
      </label>
      <p class="muted" id="rememberStatus" role="status"></p>
      <menu>
        <button value="cancel" formnovalidate class="ghost">Cancel</button>
        <button value="save" id="rememberSave">Save</button>
      </menu>
    </form>
  </dialog>

  <dialog id="tokenDialog">
    <form method="dialog">
      <p>This hub requires an API token (<code>HUB_API_TOKEN</code>).</p>
      <input id="tokenInput" type="password" placeholder="Token" autocomplete="off">
      <menu><button value="ok">Save</button></menu>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
