[project]
name = "hub"
version = "0.1.0"
description = "Personal AI orchestrator: router, provider adapters, web chat, CLI, MQTT transport"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Exact pin: LiteLLM is a large, fast-moving dependency (see docs/adr/0001).
    "litellm==1.110.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.11",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "typer>=0.15",
    "structlog>=24.4",
    "aiomqtt>=2.3",
    "jsonschema>=4.23",
]

[project.scripts]
hub = "hub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hub"]
