[project]
name = "hub"
version = "0.1.0"
description = "Personal AI orchestrator: router, provider adapters, web chat, CLI, MQTT transport"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Exact pin: LiteLLM is a large, fast-moving dependency (see docs/adr/0001).
    "litellm==1.110.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.11",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "typer>=0.15",
    "structlog>=24.4",
    "aiomqtt>=2.3",
    "jsonschema>=4.23",
    # Makes jsonschema actually check format: date-time (otherwise silently skipped).
    "rfc3339-validator>=0.1.4",
    # Stage 2 memory: vector search inside SQLite (wheels for win/linux x86_64+aarch64/mac).
    "sqlite-vec==0.1.9",
    # MCP SDK 2.x (FastMCP was renamed MCPServer). Pinned: the API moved between majors.
    "mcp==2.3.0",
    "watchfiles>=1.0",
]

[project.scripts]
hub = "hub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hub"]
