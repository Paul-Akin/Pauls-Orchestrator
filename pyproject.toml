[project]
name = "pauls-orchestrator"
version = "0.1.0"
description = "Monorepo root: hub-and-spoke personal AI orchestrator"
requires-python = ">=3.12,<3.13"
dependencies = ["hub"]

[tool.uv]
package = false

[tool.uv.sources]
hub = { workspace = true }

[tool.uv.workspace]
members = ["hub"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
    "types-jsonschema",
    "datamodel-code-generator>=0.26",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["hub"]

[tool.ruff.lint.per-file-ignores]
"hub/tests/**" = ["S", "B011", "PT018", "E741"]
"hub/src/hub/events/models.py" = ["ALL"]

[tool.mypy]
python_version = "3.12"
files = ["hub/src"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["litellm", "litellm.*", "aiomqtt", "aiomqtt.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["hub/tests"]
pythonpath = ["hub"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: hits a real provider; skipped unless its key/env is set"]
